<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website đang bảo trì — Tiên Du</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-primary: #fecd27;
    --color-near-black: #101010;
    --color-text: #252b42;
    --color-text-muted: #737373;
    --font-body: 'Inter', sans-serif;
    --font-cta: 'Plus Jakarta Sans', sans-serif;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--font-body);
    background: var(--color-near-black);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    text-align: center;
  }

  .logo-wrap {
    margin-bottom: 40px;
  }

  .logo-wrap img {
    height: 48px;
    width: auto;
  }

  .icon-wrap {
    width: 72px;
    height: 72px;
    background: rgba(254, 205, 39, 0.12);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }

  .icon-wrap svg {
    width: 36px;
    height: 36px;
    color: var(--color-primary);
  }

  .badge {
    display: inline-block;
    background: rgba(254, 205, 39, 0.15);
    color: var(--color-primary);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 64px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: var(--font-cta);
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 16px;
  }

  .subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.55);
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto 36px;
  }

  .divider {
    width: 48px;
    height: 3px;
    background: var(--color-primary);
    border-radius: 2px;
    margin: 0 auto 36px;
  }

  .contact-label {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 64px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .contact-btn:hover { opacity: 0.85; }

  .contact-btn.phone {
    background: var(--color-primary);
    color: #000;
  }

  .contact-btn.zalo {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .footer-note {
    margin-top: 48px;
    font-size: 12px;
    color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

  <div class="logo-wrap">
    <img src="assets/nav-logo.png" alt="Tiên Du Phụ Tùng Ô Tô">
  </div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
  </div>

  <span class="badge">Bảo trì hệ thống</span>

  <h1>Website đang bảo trì.<br>Hãy quay lại sau.</h1>

  <p class="subtitle">
    Chúng tôi đang nâng cấp hệ thống để phục vụ bạn tốt hơn.<br>
    Xin lỗi vì sự bất tiện này.
  </p>

  <div class="divider"></div>

  <p class="contact-label">Liên hệ trong thời gian chờ</p>

  <div class="contact-row">
    <a href="tel:0946915111" class="contact-btn phone">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.06 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 1.21h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.09 9.1A16 16 0 0 0 15 17l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17z"/></svg>
      Gọi 0946.915.111
    </a>
    <a href="https://zalo.me/0946915111" target="_blank" rel="noopener" class="contact-btn zalo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Zalo tư vấn
    </a>
  </div>

  <p class="footer-note">© 2026 Tiên Du Nha Trang · 37 Nguyễn Văn Hưởng, TP Nha Trang</p>

</body>
</html>
